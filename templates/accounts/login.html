{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OpsFlow</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card fade-in-up">
        <div class="auth-logo">
            <i class="fa-solid fa-square-poll-horizontal me-2 text-primary"></i>OpsFlow
        </div>
        <p class="text-center text-muted mb-4 font-semibold">Sign in to your work dashboard</p>
        
        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}info{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="username" autofocus maxlength="150" required id="id_username" class="form-control border-start-0 ps-0" placeholder="Enter username">
                </div>
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                    <input type="password" name="password" required id="id_password" class="form-control border-start-0 ps-0" placeholder="••••••••">
                </div>
            </div>
            
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg" style="background-color: var(--accent-color); border: none;">
                    Sign In
                </button>
            </div>
        </form>
        
        <div class="text-center mt-3">
            <span class="text-muted">New to OpsFlow? </span>
            <a href="{% url 'accounts:signup' %}" class="text-decoration-none fw-semibold" style="color: var(--accent-color);">Create an account</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
